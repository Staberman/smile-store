name: Sincronizar Tiendanube

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-tiendanube
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  # The payment-terms alert reads the previous runs' annotations.
  actions: read
  checks: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TIENDANUBE_ACCESS_TOKEN: ${{ secrets.TIENDANUBE_ACCESS_TOKEN }}
      TIENDANUBE_STORE_ID: ${{ secrets.TIENDANUBE_STORE_ID }}
      TIENDANUBE_USER_AGENT: Smile Stock Sync (smiletiendaimp.com.ar)

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Actualizar precios y stock
        run: npm run sync:catalog

      # Reads the transfer discount and interest-free installments from the
      # public storefront. On failure it keeps the last values; it never
      # blocks the stock and price sync.
      - name: Actualizar condiciones de pago
        id: terms
        continue-on-error: true
        run: npm run sync:terms

      - name: Detectar cambios
        id: changes
        run: |
          if git diff --quiet -- data/tiendanube-catalog.json data/store-terms.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verificar catálogo
        if: steps.changes.outputs.changed == 'true'
        run: npm run test:catalog

      - name: Verificar compilación
        if: steps.changes.outputs.changed == 'true'
        run: npm run build

      - name: Publicar actualización
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "Staberman"
          git config user.email "redes@staberman.com.ar"
          git add data/tiendanube-catalog.json data/store-terms.json
          git commit -m "chore: sync Tiendanube stock, prices and payment terms"
          git push

      # Records the payment-terms verdict on the run (warning or notice titled
      # "Condiciones de pago"). A warning on a green run emails nobody, so it
      # also opens an issue once two consecutive runs fail to read the terms
      # (it finds the previous verdict in the earlier runs' annotations),
      # comments on it at most daily while it stays open, and closes it once
      # they read fine. Runs last and never fails the run.
      - name: Avisar si fallan las condiciones de pago
        if: ${{ !cancelled() && steps.terms.outcome != 'skipped' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TERMS_STATUS: ${{ steps.terms.outputs.status || 'failed' }}
          TERMS_REASON: ${{ steps.terms.outputs.reason || 'el paso de condiciones de pago terminó sin resultado' }}
        run: node scripts/tiendanube/report-store-terms.mjs
